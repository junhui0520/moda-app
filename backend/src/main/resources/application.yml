# =====================================================================
# Moda MVP backend — 기본 프로파일 (H2 인메모리, 별도 설치 없이 즉시 실행)
#   실행: ./gradlew bootRun
#   MySQL 전환: SPRING_PROFILES_ACTIVE=mysql (application-mysql.yml)
# =====================================================================
server:
  port: ${PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: moda-backend

  datasource:
    # MODE=MySQL: MySQL 프로파일과 SQL 동작을 최대한 맞춤 / DB_CLOSE_DELAY=-1: JVM 종료 전까지 유지
    url: jdbc:h2:mem:moda;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console        # JDBC URL: jdbc:h2:mem:moda / User: sa / Password: (빈 값)

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop    # 인메모리 DB: 기동 시 스키마 생성 → SeedLoader가 시드 적재
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
    show-sql: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB      # api-spec.md 1.2: 사진 최대 10MB
      max-request-size: 12MB   # 요청 전체 12MB
      file-size-threshold: 0

  jackson:
    time-zone: Asia/Seoul      # 날짜·시간: ISO-8601 + KST 오프셋 (예: 2026-11-19T21:30:00+09:00)
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: always   # 값이 없어도 키를 생략하지 않고 null 출력 (api-spec.md 1.3)

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html     # → /swagger-ui/index.html
    operations-sorter: method

# ---------------------------------------------------------------------
# Moda 커스텀 설정 (com.moda.global.config.ModaProperties)
# ---------------------------------------------------------------------
moda:
  seed:
    mode: ${MODA_SEED_MODE:upsert}          # upsert | none
    location: classpath:seed/
  ai:
    mode: ${MODA_AI_MODE:mock}              # mock | external (api-spec.md 부록 A.1)
    base-url: ${MODA_AI_BASE_URL:http://localhost:8000}
    connect-timeout: 3s
    face-read-timeout: 15s
    body-read-timeout: 20s
  chat:
    mode: ${MODA_CHAT_MODE:mock}            # mock | external (api-spec.md 1.5 챗봇 Mock)
    max-turns: 20                           # 세션당 최대 대화 턴
    connect-timeout: 3s
    read-timeout: 20s                       # 초과 시 504 CHAT_TIMEOUT
    api-key: ${MODA_CHAT_API_KEY:}          # LLM API 키 — 환경변수로만 주입 (커밋 금지)
  session:
    ttl-minutes: 30                         # 쓰기 요청 성공 시마다 30분 연장 (api-spec.md 1.4)
    cleanup-interval: 5m                    # 만료 세션 정리 스케줄러 주기

logging:
  level:
    com.moda: INFO
